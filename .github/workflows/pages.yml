name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Add cache-busted tour interactions, responsive layout, and panorama background
        env:
          PAGE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          sha = os.environ["PAGE_SHA"]
          head = (
              f'<link rel="stylesheet" href="tour-carousel.css?v={sha}">'
              f'<link rel="stylesheet" href="mobile-layout.css?v={sha}">'
              f'<link rel="stylesheet" href="travel-blog.css?v={sha}">'
              f'<link rel="stylesheet" href="booking-journey.css?v={sha}">'
              "</head>"
          )
          scripts = (
              f'<script src="tour-interactions.js?v={sha}"></script>'
              f'<script src="travel-blog.js?v={sha}"></script>'
              f'<script src="booking-journey.js?v={sha}"></script>'
              "</body>"
          )
          assets = "landscape.css|natural-theme.css|natural-sales-layout.css|mobile-polish.css|nho-que-background.css|nature-background-v7.js|background-init.js|app.js"
          for name in ("index.html", "packages.html"):
              page = Path(name)
              source = page.read_text(encoding="utf-8")
              source = re.sub(
                  rf'(href|src)="({assets})(?:\?[^\"]*)?"',
                  lambda match: f'{match[1]}="{match[2]}?v={sha}"', source,
              )
              if name == "index.html":
                  source = source.replace("</head>", head).replace("</body>", scripts)
              page.write_text(source, encoding="utf-8")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
